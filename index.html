      --vermell-fosc: #7b241c;

      background-color: #fbe9e7;
    }
    .navbar.bg-primary {
      background-color: var(--vermell) !important;
    }
    .navbar-brand {
      font-weight: bold;
    }
    .nav-link.active {
      background-color: var(--vermell-clar) !important;

    .nav-link {
      color: #f5d5d0 !important;
    }
    .nav-link:hover {

    .tab-content {

      margin: 40px auto;
      padding: 25px;
      background-color: #fff;
      border: 2px solid var(--vermell);
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(192, 57, 43, 0.3);
